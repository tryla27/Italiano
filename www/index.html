<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b221f">
<style>html{box-sizing:border-box;-webkit-tap-highlight-color:transparent}*,*::before,*::after{box-sizing:inherit}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pizzeria Parola</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: one-screen phone game on a pizzeria chalkboard — HUD, guest scene, action area, footer controls. Single dark look by choice. */
:root{
  --slate:#1b221f; --slate2:#26302b; --slate3:#313d37; --line:#3c4842;
  --chalk:#f3eee2; --chalk-dim:#aab4ab; --tomato:#e5533f; --tomato-soft:#4a2520;
  --basil:#6bbb5f; --basil-soft:#21392a; --crust:#e6ad5e; --gold:#f4c64f; --wood:#5b3b24;
  --game:"Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, sans-serif;
  --hand:"Caveat", "Comic Sans MS", cursive;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--slate);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.4;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.05),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(255,255,255,.035),transparent 50%)}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
#screen{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:12px 18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#screen>*{flex-shrink:0}
button{font-family:var(--body);color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:400}
.hand{font-family:var(--hand)}

/* Home */
.sign{text-align:center;padding:20px 12px 16px;border:2px solid var(--line);border-radius:20px;background:var(--slate2);position:relative}
.sign .lvl{font-family:var(--hand);font-size:1.5rem;color:var(--gold)}
.sign h1{font-family:var(--game);font-size:2.6rem;line-height:1;color:var(--chalk);letter-spacing:.01em;text-wrap:balance}
.sign h1 span{color:var(--tomato)}
.sign .lvl-de{display:block;margin-top:6px;font-size:.82rem;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.1em}
.shelf{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:1.6rem;min-height:2rem}
.shelf .empty{font-family:var(--hand);font-size:1.2rem;color:var(--chalk-dim)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--slate2);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-family:var(--game);font-size:1.4rem;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:.68rem;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.06em}
.big{border:0;border-radius:18px;padding:16px;background:var(--tomato);color:#fff;font-family:var(--game);font-size:1.6rem;box-shadow:0 5px 0 #9c2f22;display:flex;flex-direction:column;align-items:center;gap:2px}
.big small{font-family:var(--body);font-size:.85rem;font-weight:600;opacity:.9}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #9c2f22}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{border:2px solid var(--line);background:var(--slate2);border-radius:14px;padding:12px;font-weight:800;font-size:1rem}
.how{border-top:1px dashed var(--line);padding-top:12px}
.how h3{font-family:var(--hand);font-size:1.5rem;color:var(--gold)}
.how ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--chalk-dim);font-size:.92rem}
.how b{color:var(--chalk)}
.savenote{margin:-4px 0 0;text-align:center;font-size:.8rem;color:var(--basil)}
.update{border:2px solid var(--gold);background:var(--slate2);color:var(--gold);border-radius:14px;padding:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.update small{font-weight:600;color:var(--chalk-dim)}
.lvls{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:7px;font-size:.9rem;color:var(--chalk-dim)}
.lvls b{color:var(--chalk);font-family:var(--hand);font-size:1.25rem;font-weight:700;margin-right:4px}
.lvls li.done b{color:var(--basil)} .lvls li.done b::after{content:" ✓"}
.lvls li.now b{color:var(--gold)} .lvls li.now b::after{content:" ← du bist hier";font-family:var(--body);font-size:.75rem;font-weight:800}
.room{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:16px;overflow:hidden;border:2px solid var(--line);touch-action:none}
.room .wall{position:absolute;inset:0 0 45% 0;background:linear-gradient(#e9dcc3,#dccaa8);}
.room .wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10%;background:#b8562f}
.room .floor{position:absolute;inset:55% 0 0 0;background-color:#efe7d6;background-image:linear-gradient(45deg,#2f3a35 25%,transparent 25%,transparent 75%,#2f3a35 75%),linear-gradient(45deg,#2f3a35 25%,transparent 25%,transparent 75%,#2f3a35 75%);background-size:28px 28px;background-position:0 0,14px 14px}
.ri{position:absolute;transform:translate(-50%,-50%);touch-action:none;line-height:0}
.ri svg,.pia svg,#ghost svg{width:100%;height:auto;display:block}
.emo{display:block;font-size:2rem;line-height:1;text-align:center}
.room.edit{position:sticky;top:0;z-index:5;width:min(100%,40vh*4/3);align-self:center;box-shadow:0 8px 18px rgba(0,0,0,.45)}
.room.edit .ri{cursor:grab}
.ri[data-act]{cursor:pointer}
.ri.hit{filter:drop-shadow(0 0 6px var(--basil)) drop-shadow(0 0 3px var(--basil))}
.ri.miss{animation:shake .35s;filter:drop-shadow(0 0 6px var(--tomato))}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pi{background:var(--slate2);border:2px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;touch-action:none;cursor:grab;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.pi .pia{width:34px}
.pi b{font-size:.74rem;line-height:1.1}
.pi small{font-size:.64rem;color:var(--chalk-dim);line-height:1.1}
.pi i{position:absolute;top:4px;right:6px;font-style:normal;font-size:.7rem;color:var(--gold);font-weight:800}
.pi.used{opacity:.4;cursor:default}
#ghost{position:fixed;z-index:40;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.vocabbtn{border:2px solid var(--basil);background:var(--basil-soft);color:var(--chalk);border-radius:16px;padding:12px;font-family:var(--game);font-size:1.35rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.vocabbtn small{font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--chalk-dim)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 .sec{padding:12px 4px;font-size:.92rem}
.sec:disabled{opacity:.4}
input,textarea{-webkit-user-select:text;user-select:text}
.vcard{background:var(--chalk);color:#1e2420;border-radius:18px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.vcard .label{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:#6b6f68;font-weight:800}
.vword{font-family:var(--game);font-size:2.2rem;line-height:1.1;overflow-wrap:anywhere}
.vword.de{font-family:var(--body);font-weight:800;font-size:1.6rem}
.vform{display:flex;gap:8px}
.vform input{flex:1;min-width:0;font:600 1.15rem var(--body);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--slate2);color:var(--chalk)}
.vform input:focus{outline:none;border-color:var(--gold)}
.vform .serve{padding:12px 16px;font-size:1.1rem}
.accents{display:flex;gap:6px;flex-wrap:wrap}
.accents button{border:1px solid var(--line);background:var(--slate2);border-radius:10px;min-width:40px;padding:8px;font-weight:800;font-size:1.05rem}
.bar{height:8px;border-radius:99px;background:var(--slate3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--basil);border-radius:99px;transition:width .3s}
.vday.done .ic{color:var(--basil)} .vday.locked{opacity:.55}
.link{background:none;border:0;color:var(--chalk-dim);text-decoration:underline;font-size:.9rem;align-self:center;padding:6px}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.hud .where{font-size:.85rem;color:var(--chalk-dim);font-weight:600}
.stars{color:var(--gold);letter-spacing:1px;font-size:1rem;white-space:nowrap}
.stars .off{color:var(--slate3)}
.stars .half{background:linear-gradient(90deg,var(--gold) 50%,var(--slate3) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.money{font-family:var(--game);font-size:1.3rem;color:var(--gold)}
.quit{background:var(--slate2);border:0;border-radius:10px;padding:6px 10px;font-size:.8rem;color:var(--chalk-dim)}
.combo{align-self:center;background:var(--gold);color:#3a2a00;font-family:var(--game);padding:3px 12px;border-radius:999px;font-size:.95rem}
.banner{background:var(--basil-soft);border:1px solid var(--basil);color:var(--chalk);border-radius:12px;padding:8px 12px;font-size:.9rem;text-align:center}

/* Scene */
.scene{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:start}
.av{width:78px;height:78px;border-radius:50%;background:var(--slate3);overflow:hidden;position:relative}
.av svg{width:100%;height:100%;display:block}
.who{font-family:var(--hand);font-size:1.25rem;color:var(--gold);line-height:1;margin-bottom:4px}
.bubble{background:var(--chalk);color:#1e2420;border-radius:4px 18px 18px 18px;padding:12px 14px;min-width:0;position:relative}
.bubble .it{font-weight:800;font-size:1.12rem;line-height:1.35;overflow-wrap:anywhere}
.bubble .tr{margin-top:6px;padding-top:6px;border-top:1px dashed #b9b1a0;font-size:.92rem;color:#4a4f49}
.say{border:0;background:#e9e1cf;color:#1e2420;border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:800;margin-top:8px;margin-right:6px}
.phone-call{display:flex;flex-direction:column;gap:6px}
.phone-call .ring{font-weight:800;font-size:1.05rem}
.task{font-family:var(--hand);font-size:1.45rem;color:var(--chalk);line-height:1.1}

/* Options */
.opts{display:grid;gap:9px}
.opt{text-align:left;border:2px solid var(--line);background:var(--slate2);border-radius:14px;padding:12px 14px;font-size:1rem;font-weight:600;line-height:1.3}
.opt small{display:block;font-weight:400;color:var(--chalk-dim);font-size:.85rem;margin-top:3px}
.opt.ok{border-color:var(--basil);background:var(--basil-soft)}
.opt.bad{border-color:var(--tomato);background:var(--tomato-soft);color:var(--chalk-dim);text-decoration:line-through}
.opt[aria-disabled="true"]{cursor:default}
.w{border-bottom:1px dotted currentColor;cursor:help;-webkit-touch-callout:none}
.opt .w{border-bottom-color:transparent}
#pop{position:fixed;z-index:30;background:var(--gold);color:#2a1f00;border-radius:10px;padding:6px 10px;font-weight:800;font-size:.95rem;box-shadow:0 6px 18px rgba(0,0,0,.4);max-width:70vw;pointer-events:none}
#pop small{display:block;font-weight:600;font-size:.75rem;opacity:.75}
body{-webkit-user-select:none;user-select:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* Pizza */
.kitchen{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.pz-wrap{position:relative}
.pz{width:150px;height:150px;display:block}
.qtyb{position:absolute;right:-4px;top:-4px;background:var(--gold);color:#3a2a00;font-family:var(--game);border-radius:999px;padding:2px 9px;font-size:1rem}
.pz-side{display:flex;flex-direction:column;gap:8px;min-width:0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--slate2);font-size:1.2rem;font-weight:800}
.stepper b{font-family:var(--game);font-size:1.4rem;font-weight:400;min-width:1.5ch;text-align:center}
.stepper span{font-size:.8rem;color:var(--chalk-dim)}
.menu-btn{border:2px dashed var(--line);background:none;border-radius:12px;padding:8px;font-family:var(--hand);font-size:1.25rem}
.ings{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ing{border:2px solid var(--line);background:var(--slate2);border-radius:12px;padding:9px 4px;font-size:.88rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.ing i{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.ing[aria-pressed="true"]{border-color:var(--gold);background:var(--slate3)}
.serve{border:0;border-radius:14px;padding:14px;background:var(--basil);color:#10240f;font-family:var(--game);font-size:1.35rem;box-shadow:0 4px 0 #3d7a35}
.serve:active{transform:translateY(3px);box-shadow:0 1px 0 #3d7a35}

/* Footer controls */
.ctrl{display:flex;gap:10px;align-items:stretch}
.tipbtn{flex:1;border:2px solid var(--gold);background:none;color:var(--gold);border-radius:14px;padding:11px;font-weight:800}
.idk{flex:none;width:56px;height:52px;border:0;border-radius:14px;background:var(--tomato);color:#fff;font-size:1.7rem;font-weight:800;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.idk small{font-size:.55rem;font-weight:800;letter-spacing:.02em}
.spacer{flex:1}
.tipbox{background:var(--slate2);border-left:4px solid var(--gold);border-radius:4px 12px 12px 4px;padding:10px 12px;font-size:.95rem}
.tipbox b{color:var(--gold)}
.fb{text-align:center;font-family:var(--hand);font-size:1.6rem;line-height:1.1}
.fb.good{color:var(--basil)} .fb.meh{color:var(--gold)} .fb.zero{color:var(--tomato)}
.next{border:0;border-radius:14px;padding:14px;background:var(--chalk);color:#1b221f;font-family:var(--game);font-size:1.35rem;width:100%}

/* Lists: summary, shop, book */
.panel{background:var(--slate2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.line{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.line.total{border-top:1px dashed var(--line);padding-top:8px;font-family:var(--game);font-size:1.3rem}
.review{font-family:var(--hand);font-size:1.6rem;line-height:1.15;color:var(--chalk);text-align:center}
.review small{display:block;font-family:var(--body);font-size:.85rem;color:var(--chalk-dim);margin-top:4px}
h2.t{font-family:var(--game);font-size:1.8rem}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--slate2);border-radius:14px;padding:10px 12px}
.item .ic{font-size:1.6rem;text-align:center}
.item .nm{font-weight:800;min-width:0}
.item .nm small{display:block;font-weight:400;color:var(--chalk-dim);font-size:.82rem}
.buy{border:0;border-radius:10px;padding:8px 12px;background:var(--gold);color:#3a2a00;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.buy:disabled{background:var(--slate3);color:var(--chalk-dim);cursor:default}
.owned{color:var(--basil);font-weight:800;font-size:.85rem}
.item.up{border:2px solid var(--gold)}
.book-e{background:var(--slate2);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.book-e .i{font-weight:800;min-width:0}
.book-e .d{color:var(--chalk-dim);font-size:.9rem;grid-column:1;min-width:0}
.book-e .m{grid-row:1/3;grid-column:2;align-self:center;color:var(--tomato);font-size:.8rem;font-weight:800}
.note{color:var(--chalk-dim);font-size:.88rem}
.back{align-self:flex-start;background:none;border:0;color:var(--chalk-dim);font-weight:800;padding:4px 0}

/* Overlay menu */
#overlay{position:fixed;inset:0;background:rgba(10,14,12,.75);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--slate2);width:100%;max-width:520px;border-radius:22px 22px 0 0;max-height:82%;overflow-y:auto;
  padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.sheet h2{font-family:var(--hand);font-size:2rem;color:var(--gold);text-align:center}
.vrow{display:grid;grid-template-columns:1fr 3.4em;gap:4px 10px;align-items:center}
.vrow label{grid-column:1/3;font-weight:800}
.vrow input{width:100%;accent-color:var(--gold);height:28px}
.vrow output{text-align:right;font-variant-numeric:tabular-nums;color:var(--chalk-dim)}
.vcheck{display:flex;gap:10px;align-items:center;font-weight:600;padding:4px 0}
.vcheck input{width:20px;height:20px;accent-color:var(--gold)}
.mi{border-bottom:1px dashed var(--line);padding-bottom:8px}
.mi b{font-family:var(--hand);font-size:1.45rem;font-weight:700}
.mi div{color:var(--chalk-dim);font-size:.92rem}
.mi .price{float:right;font-family:var(--game);font-size:1.1rem;color:var(--gold)}
@media (prefers-reduced-motion: reduce){.shake{animation:none}.big:active,.serve:active{transform:none}}
</style>

<div class="app"><div id="screen"></div></div>
<div id="overlay" hidden></div>
<div id="pop" hidden></div>
<div id="ghost" hidden></div>

<script>
/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const sample=(a,n)=>shuffle(a).slice(0,n);
const listIt=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" e "+a[a.length-1];
const listDe=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" und "+a[a.length-1];

/* ---------- Content ---------- */
const ING={pomodoro:["Tomate","#d8402b"],mozzarella:["Mozzarella","#f6f0e2"],basilico:["Basilikum","#3f9a45"],funghi:["Pilze","#b08d6a"],
  prosciutto:["Schinken","#e79a9a"],salame:["Salami","#a3262a"],olive:["Oliven","#2a2a2a"],cipolla:["Zwiebeln","#cfa6dc"],
  peperoni:["Paprika","#f2b134"],tonno:["Thunfisch","#c8a17f"],carciofi:["Artischocken","#8aa357"],rucola:["Rucola","#4f8a2a"]};
const EXTRAS=Object.keys(ING).filter(k=>k!=="pomodoro"&&k!=="mozzarella");
const MENU=[
  {n:"margherita",p:7,pl:"margherite",ing:["pomodoro","mozzarella","basilico"]},
  {n:"diavola",p:9,pl:"diavole",ing:["pomodoro","mozzarella","salame"]},
  {n:"capricciosa",p:11,pl:"capricciose",ing:["pomodoro","mozzarella","prosciutto","funghi","carciofi","olive"]},
  {n:"prosciutto e funghi",p:10,pl:"prosciutto e funghi",ing:["pomodoro","mozzarella","prosciutto","funghi"]},
  {n:"tonno e cipolla",p:9,pl:"tonno e cipolla",ing:["pomodoro","mozzarella","tonno","cipolla"]},
  {n:"ortolana",p:9,pl:"ortolane",ing:["pomodoro","mozzarella","peperoni","cipolla","funghi"]},
  {n:"crudo e rucola",p:11,pl:"crudo e rucola",ing:["pomodoro","mozzarella","prosciutto","rucola"]}
];
const cap=s=>s.replace(/\b\w/g,c=>c.toUpperCase());
const QIT=["","una","due","tre","quattro"], QDE=["","eine","zwei","drei","vier"];
function numIt(n){
  const u=["zero","uno","due","tre","quattro","cinque","sei","sette","otto","nove","dieci","undici","dodici","tredici","quattordici","quindici","sedici","diciassette","diciotto","diciannove"];
  const t=["","","venti","trenta","quaranta","cinquanta","sessanta","settanta","ottanta","novanta"];
  if(n<20)return u[n];
  if(n<100){const d=Math.floor(n/10),r=n%10;let w=t[d];if(r===1||r===8)w=w.slice(0,-1);return w+(r===0?"":r===3?"tré":u[r]);}
  if(n<200){const r=n-100;return r===0?"cento":(r===1||r===8||(r>=80&&r<90)?"cent":"cento")+numIt(r);}
  return u[Math.floor(n/100)]+"cento"+(n%100?numIt(n%100):"");
}

const S0={coins:0,level:0,owned:[],day:1,streak:0,last:"",book:{},learned:[],sound:true,vol:{music:.6,sfx:.8,voice:1},room:null,setupDone:false,setupQuiz:null,vocab:{days:{},done:{}},vocabRun:null};
let S=Object.assign({},S0,{vol:Object.assign({},S0.vol)});
/* Speichern: nach JEDER Aktion. Sofort auf dem Gerät, und zusätzlich in deinem Claude-Konto (falls verfügbar). */
const KEY="pizzeria-parola";
const enc=(k,v)=>v instanceof Set?{__set:[...v]}:v;
const dec=(k,v)=>v&&typeof v==="object"&&Array.isArray(v.__set)?new Set(v.__set):v;
let savedAt=0, lastBody="", dbRef=null, cloudState="local", writing=false, dirty=false, cloudTimer=null;
function stateBody(){return JSON.stringify({v:2,S,G,screen:(screen==="play"||screen==="summary")?screen:"home"},enc);}
function save(){
  let body; try{body=stateBody();}catch(e){return;}
  if(body===lastBody)return;
  lastBody=body; savedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify({savedAt,state:body}));}catch(e){}
  clearTimeout(cloudTimer); cloudTimer=setTimeout(cloudSave,400);
}
async function cloudSave(){
  if(!dbRef)return;
  if(writing){dirty=true;return;}
  writing=true;
  try{do{dirty=false;await dbRef.set({savedAt,state:lastBody});}while(dirty);cloudState="cloud";}
  catch(e){cloudState="local";}
  writing=false;
}
function applySave(raw){
  try{
    let o=JSON.parse(raw), at=0;
    if(o&&typeof o.state==="string"){at=o.savedAt||0;o=JSON.parse(o.state,dec);}
    if(!o)return false;
    if(!o.S&&o.coins!==undefined)o={S:o}; // alter Speicherstand
    if(!o.S)return false;
    S=Object.assign({},S0,o.S); S.vol=Object.assign({},S0.vol,o.S.vol||{});
    S.level=Math.min(S.level||0,LEVELS.length-1);
    G=o.G||null; screen=o.screen||"home"; if(screen!=="home"&&!G)screen="home";
    savedAt=at; lastBody=stateBody(); return true;
  }catch(e){return false;}
}
function flushSave(){save();clearTimeout(cloudTimer);cloudSave();}
window.addEventListener("pagehide",flushSave);
document.addEventListener("visibilitychange",()=>{if(document.hidden)flushSave();});

// In der Android-App spricht die native Stimme (Capacitor-Plugin), im Browser die Web-Stimme.
const NativeTTS=(()=>{try{const C=window.Capacitor;return C&&C.isNativePlatform&&C.isNativePlatform()?(C.Plugins&&C.Plugins.TextToSpeech)||null:null;}catch(e){return null;}})();
const canSpeak=!!NativeTTS||"speechSynthesis" in window;
function speak(t){
  if(!canSpeak||S.vol.voice<=0)return;
  if(NativeTTS){
    duck(true);
    NativeTTS.stop().catch(()=>{}).then(()=>NativeTTS.speak({text:t,lang:"it-IT",rate:.9,volume:S.vol.voice,category:"playback"}))
      .then(()=>duck(false)).catch(()=>duck(false));
    return;
  }
  try{const u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.volume=S.vol.voice;
    const v=speechSynthesis.getVoices().find(v=>/^it/i.test(v.lang));if(v)u.voice=v;u.rate=.88;
    u.onstart=()=>duck(true);u.onend=u.onerror=()=>duck(false);
    speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
if(canSpeak){try{speechSynthesis.getVoices();}catch(e){}}

/* ---------- Music (3 Pixabay tracks, each played twice) & sound effects ---------- */
let AC=null, musicGain=null, sfxGain=null, musicOn=false, ducked=false;
const mtof=m=>440*Math.pow(2,(m-69)/12);
const TRACKS=["music/italian-tarantella.mp3","music/italian-sweetness.mp3","music/tarantella-napoletana.mp3"];
const PLAYS_PER_TRACK=2;
const song=new Audio(); song.preload="auto"; song.src=TRACKS[0];
let trackI=0, playsLeft=PLAYS_PER_TRACK;
song.addEventListener("ended",()=>{
  playsLeft--;
  if(playsLeft<=0){trackI=(trackI+1)%TRACKS.length;playsLeft=PLAYS_PER_TRACK;song.src=TRACKS[trackI];}
  else song.currentTime=0;
  song.play().catch(()=>{});
});
function initAudio(){
  if(AC)return true;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    musicGain=AC.createGain();sfxGain=AC.createGain();
    musicGain.connect(AC.destination);sfxGain.connect(AC.destination);
    try{AC.createMediaElementSource(song).connect(musicGain);}catch(e){}
    applyVolume(); return true;
  }catch(e){AC=null;return false;}
}
function applyVolume(){
  if(!AC)return;
  musicGain.gain.setTargetAtTime(S.vol.music*.8*(ducked?.35:1),AC.currentTime,.08);
  if(S.vol.music<=0&&musicOn){song.pause();musicOn=false;}
  sfxGain.gain.setTargetAtTime(S.vol.sfx*.8,AC.currentTime,.02);
}
function duck(on){ducked=on;applyVolume();}
function pluck(t,f,dur,vol,out){
  const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
  o.type="sawtooth";o2.type="triangle";o.frequency.value=f;o2.frequency.value=f*1.003;
  lp.type="lowpass";lp.frequency.value=2600;lp.Q.value=1;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(out);
  o.start(t);o2.start(t);o.stop(t+dur+.02);o2.stop(t+dur+.02);
}
function tone(t,f,dur,vol,type,out,f2){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.02);
}
function startMusic(){
  if(!initAudio()||musicOn)return;
  if(AC.state==="suspended")AC.resume();
  musicOn=true;
  song.play().catch(()=>{musicOn=false;});
}
function sfx(kind){
  if(!AC||S.vol.sfx<=0)return;
  if(AC.state==="suspended")AC.resume();
  const t=AC.currentTime+.005;
  if(kind==="click")tone(t,1400,.05,.25,"triangle",sfxGain,900);
  if(kind==="select")tone(t,700,.07,.3,"square",sfxGain,1050);
  if(kind==="right"){[72,76,79,84].forEach((n,i)=>pluck(t+i*.07,mtof(n),.35,.32,sfxGain));tone(t+.28,mtof(96),.4,.08,"sine",sfxGain);}
  if(kind==="wrong"){tone(t,180,.32,.35,"sawtooth",sfxGain,110);tone(t+.02,190,.3,.25,"square",sfxGain,120);}
  if(kind==="coins"){[88,93].forEach((n,i)=>tone(t+i*.09,mtof(n),.25,.2,"sine",sfxGain));}
}
document.addEventListener("pointerdown",()=>{
  const was=musicOn; initAudio();
  if(S.vol.music>0)startMusic(); else if(AC&&AC.state==="suspended")AC.resume();
  if(!was&&musicOn&&screen==="home")setTimeout(()=>{if(screen==="home"&&!volOpen)render();},300);
},{capture:true});
document.addEventListener("visibilitychange",()=>{
  if(!AC)return;
  if(document.hidden){song.pause();AC.suspend();}
  else{AC.resume();if(musicOn)song.play().catch(()=>{});}
});

/* ---------- Step builders ---------- */
function mcStep(item,task,extra){
  const [it,de,cor,corDe,wr,tip,q]=item;
  return Object.assign({kind:"mc",it,de,task:q||task,tip,corDe,opts:shuffle([{t:cor,ok:true},...wr.map(t=>({t,ok:false}))]),wrong:0,bad:[],done:false},extra||{});
}
function pickFresh(pool){const fresh=pool.filter(p=>!G.used.has(p[0]));const p=pick(fresh.length?fresh:pool);G.used.add(p[0]);return p;}

function orderStep(L){
  const ops=[["Vorrei","Ich hätte gern"],["Per me","Für mich"],["Allora, prendo","Also, ich nehme"],["Mi porta","Bringen Sie mir"]];
  const [op,opDe]=pick(ops);
  let qty=L===0?1:rnd(1,L===1?2:3), want, it, de, words=[], named=null, senza=null, con=null;
  const r=Math.random();
  const explicit=L===0||(L===1&&r>.75)||(L===2&&r>.85);
  if(explicit){
    const ex=sample(EXTRAS,rnd(1,L===0?2:3)); const base=Math.random()<.2?["mozzarella"]:["pomodoro","mozzarella"];
    const all=[...base,...ex]; want=new Set(all); words=all;
    it=`${op} ${QIT[qty]} ${qty>1?"pizze":"pizza"} con ${listIt(all)}, per favore.`;
    de=`${opDe} ${QDE[qty]} ${qty>1?"Pizzen":"Pizza"} mit ${listDe(all.map(k=>ING[k][0]))}, bitte.`;
  }else{
    named=pick(MENU); want=new Set(named.ing);
    const wantSenza=L===1?r>.45:(r<.3||(r>=.6&&r<.85)), wantCon=L===2&&r>=.3&&r<.85;
    if(wantSenza){senza=pick(named.ing.filter(k=>k!=="pomodoro"));want.delete(senza);words.push(senza);}
    if(wantCon){con=pick(EXTRAS.filter(k=>!named.ing.includes(k)));want.add(con);words.push(con);}
    const nm=qty>1?named.pl:named.n;
    it=`${op} ${QIT[qty]} ${nm}${senza?` senza ${senza}`:""}${con?`${senza?" ma":""} con ${con}`:""}, per favore.`;
    de=`${opDe} ${QDE[qty]} ${cap(named.n)}${senza?` ohne ${ING[senza][0]}`:""}${con?`${senza?", aber":""} mit ${ING[con][0]}`:""}, bitte.`;
  }
  let tip=words.length?`<b>Wörter:</b> ${words.map(w=>`${w} = ${ING[w][0]}`).join(", ")}.`:"";
  if(senza)tip+=` <b>senza</b> = ohne.`; if(con)tip+=` <b>con</b> = mit.`;
  if(named)tip+=` Was auf eine ${cap(named.n)} gehört, steht im Menù.`;
  if(L>0)tip+=` Anzahl: una = 1, due = 2, tre = 3.`;
  const each=named?named.p+(con?1:0):5+want.size;
  return {kind:"pizza",it,de,task:"Belege die Pizza und servier sie!",tip,want,qty,price:each*qty,cur:new Set(),curQty:1,wrong:0,done:false};
}
function phoneStep(){
  const q=rnd(1,4), p=pick(MENU), t=pick(TIMES), st=pick(STREETS), n=pick(NUMS);
  const pz=q===1?`una ${p.n}`:`${QIT[q]} ${p.pl}`;
  const it=`Pronto, pizzeria? Vorrei ordinare ${pz} per le ${t[0]}. L'indirizzo è ${st}, numero ${n[0]}.`;
  const de=`Hallo, Pizzeria? Ich möchte ${QDE[q]} ${cap(p.n)} für ${t[1]} Uhr bestellen. Die Adresse ist ${st} Nummer ${n[1]}.`;
  const kind=pick(["qty","time","num","pizza"]); let task,opts,tip;
  if(kind==="qty"){task="Wie viele Pizzen will er?";opts=[1,2,3,4].map(x=>({t:String(x),ok:x===q}));tip="Die Anzahl kommt direkt nach „ordinare“. una = 1, due = 2, tre = 3, quattro = 4.";}
  if(kind==="time"){task="Für wann ist die Bestellung?";opts=shuffle([t,...sample(TIMES.filter(x=>x!==t),3)]).map(x=>({t:x[1]+" Uhr",ok:x===t}));tip="Die Uhrzeit kommt nach „per le“. sette = 7, otto = 8, nove = 9, e mezza = halb, e un quarto = Viertel nach.";}
  if(kind==="num"){task="Welche Hausnummer?";opts=shuffle([n,...sample(NUMS.filter(x=>x!==n),3)]).map(x=>({t:"Nr. "+x[1],ok:x===n}));tip="Die Hausnummer kommt nach „numero“. due = 2, dieci = 10, dodici = 12, venti = 20, trenta = 30.";}
  if(kind==="pizza"){task="Welche Pizza will er?";opts=shuffle([p,...sample(MENU.filter(x=>x!==p),3)]).map(x=>({t:cap(x.n),ok:x===p}));tip="Hör auf das Wort nach der Anzahl. Plural: margherite, diavole, capricciose, ortolane.";}
  return {kind:"mc",phone:true,it,de,task,tip,opts,wrong:0,bad:[],done:false,showText:!canSpeak,price:p.p*q};
}
function reservStep(){
  const n=rnd(2,8), d=pick(DAYS), t=pick(TIMES), nm=pick(SURNAMES);
  const NW=["","","due","tre","quattro","cinque","sei","sette","otto"];
  const it=`Buonasera, vorrei prenotare un tavolo per ${NW[n]} persone, ${d[0]} sera alle ${t[0]}. A nome ${nm}.`;
  const de=`Guten Abend, ich möchte einen Tisch für ${n} Personen reservieren, ${d[1]}abend um ${t[1]} Uhr. Auf den Namen ${nm}.`;
  const kind=pick(["pers","day","time","name"]); let task,opts,tip;
  if(kind==="pers"){task="Für wie viele Personen?";const o=shuffle([n,...sample([2,3,4,5,6,7,8].filter(x=>x!==n),3)]);opts=o.map(x=>({t:x+" Personen",ok:x===n}));tip="Die Zahl steht vor „persone“. due 2, tre 3, quattro 4, cinque 5, sei 6, sette 7, otto 8.";}
  if(kind==="day"){task="An welchem Tag?";opts=shuffle([d,...sample(DAYS.filter(x=>x!==d),3)]).map(x=>({t:x[1],ok:x===d}));tip="Wochentage: lunedì Mo, martedì Di, mercoledì Mi, giovedì Do, venerdì Fr, sabato Sa, domenica So.";}
  if(kind==="time"){task="Um wie viel Uhr?";opts=shuffle([t,...sample(TIMES.filter(x=>x!==t),3)]).map(x=>({t:x[1]+" Uhr",ok:x===t}));tip="Die Uhrzeit kommt nach „alle“. sette = 7, otto = 8, nove = 9, e mezza = halb.";}
  if(kind==="name"){task="Auf welchen Namen?";opts=shuffle(SURNAMES.slice()).slice(0,4);if(!opts.includes(nm))opts[0]=nm;opts=shuffle(opts).map(x=>({t:x,ok:x===nm}));tip="Der Name kommt nach „a nome“ (auf den Namen).";}
  return {kind:"mc",phone:true,it,de,task,tip,opts,wrong:0,bad:[],done:false,showText:!canSpeak};
}

function billStep(total){
  const item=pickFresh(BILL);
  let w=total; while(w===total||w<1)w=total+pick([-3,-2,-1,1,2,3,10,-10]);
  const f=x=>x.replace("{N}",numIt(total)).replace("{D}",total).replace("{W}",numIt(w));
  return mcStep([f(item[0]),f(item[1]),f(item[2]),f(item[3]),item[4].map(f),f(item[5])],"Was antwortest du?",{bill:total});
}

/* ---------- Game flow ---------- */
let screen="home", G=null, menuOpen=false, volOpen=false;
function startDay(){
  const L=S.level, LV=LEVELS[L];
  G={guests:[],gi:0,si:0,earned:0,revenue:0,saved:0,stars:5,combo:0,maxCombo:0,used:new Set(),phase:"guest",banner:"",market:[],mi:0,firstTry:0,steps:0};
  const phoneSlots=new Set(sample([...Array(LV.guests).keys()].slice(1),LV.phones));
  const names=shuffle(NAMES);
  for(let i=0;i<LV.guests;i++){
    let steps;
    if(phoneSlots.has(i))steps=[LV.reserv&&Math.random()<.5?reservStep():phoneStep()];
    else{
      const ord=orderStep(L===0?0:L<=2?1:2); let total=ord.price;
      steps=[mcStep(pickFresh(GREET),"Was antwortest du?"),ord];
      if(LV.drinks){const di=pickFresh(DRINK);total+=DRINK_PRICE[DRINK.indexOf(di)]||0;steps.push(mcStep(di,"Was antwortest du?"));}
      if(!LV.talkChance||Math.random()<LV.talkChance)steps.push(mcStep(pickFresh(pick(LV.talk)),"Was antwortest du?"));
      steps.push(billStep(total));
    }
    const bill=steps.reduce((a,x)=>a+(x.bill||0),0)||(phoneSlots.has(i)?steps[0].price||0:0);
    G.guests.push({name:phoneSlots.has(i)?"Telefono":names[i%names.length],mood:2,steps,tip:0,bill,phone:phoneSlots.has(i)});
  }
  G.market=sample(MARKET,2).map(m=>mcStep(m,"Was antwortest du?",{market:true}));
  screen="play"; render(); autoSpeak();
}
const curStep=()=>G.phase==="market"?G.market[G.mi]:G.guests[G.gi].steps[G.si];
const curGuest=()=>G.phase==="market"?null:G.guests[G.gi];
function autoSpeak(){const st=curStep();if(st&&(S.sound||st.phone)&&(!st.phone||!st.showText||S.sound))setTimeout(()=>speak(st.it),250);}

function wrongAnswer(i){
  const st=curStep(), g=curGuest();
  st.wrong++; if(i!==undefined)st.bad.push(i);
  if(st.wrong===1)G.stars=Math.max(1,G.stars-.5);
  if(g)g.mood=Math.max(0,g.mood-1);
  G.combo=0; st.shake=true;
  if(st.kind==="mc")note(st.it,st.de);
}
function finish(){
  const st=curStep(), g=curGuest(), LV=LEVELS[S.level];
  st.done=true; G.steps++;
  const f=st.wrong===0?1:st.wrong===1?.5:.25;
  if(st.market){
    const sv=Math.max(1,Math.round(Math.round((G.revenue||0)*.35)*.25*f)); G.saved+=sv; st.fb=[st.wrong?"meh":"good",`Gut verhandelt! −${sv} € beim Einkauf`];
  }else{
    let base=LV.base*(st.kind==="pizza"?1.5:st.phone?2:1)*f*(st.textShown?.5:1);
    let bonus=0;
    if(st.wrong===0&&!st.peeked){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);bonus=G.combo>=3?Math.min(Math.floor(G.combo/3),3):0;}
    const tip=Math.max(1,Math.round(base*mult()))+bonus;
    G.earned+=tip; if(g)g.tip+=tip;
    st.fb=[st.wrong?"meh":"good",(st.wrong?"Geschafft! ":pick(["Perfetto! ","Bravo! ","Esatto! ","Benissimo! "]))+`+${tip} € Trinkgeld${bonus?` (Combo +${bonus})`:""}`+(st.bill?` · Rechnung ${st.bill} €`:"")];
  }
  if(st.wrong===0){G.firstTry++;learn(st.it);}
  if(st.kind==="pizza")st.cur=new Set(st.want);
  if(!st.market||st.corDe)collectStep(st);
  save();
}
function giveUp(){
  const st=curStep(), g=curGuest();
  st.done=true; st.gaveUp=true; G.steps++;
  G.stars=Math.max(1,G.stars-1); G.combo=0; if(g)g.mood=0;
  if(st.kind==="pizza"){
    [...new Set([...st.want,...st.cur])].filter(k=>st.want.has(k)!==st.cur.has(k)).forEach(k=>note(k,ING[k][0]));
    st.cur=new Set(st.want); st.curQty=st.qty;
  }
  note(st.it,st.de);
  collectStep(st);
  st.fb=["zero","Kein Problem, so wäre es richtig gewesen."+(st.bill?` Er zahlt trotzdem ${st.bill} €.`:"")];
  save();
}
function advance(){
  if(G.phase==="market"){ G.mi++; if(G.mi>=G.market.length){endDay();return;} }
  else{
    const g=G.guests[G.gi]; G.si++;
    if(G.si>=g.steps.length){
      G.revenue=(G.revenue||0)+(g.bill||0);
      G.banner=g.phone?(g.bill?`Lieferung notiert: ${g.bill} € + ${g.tip} € Trinkgeld`:`Reservierung notiert. +${g.tip} € Trinkgeld`):`${g.name} geht ${g.mood>=2?"glücklich":g.mood===1?"zufrieden":"etwas verwirrt"} und zahlt ${g.bill} € + ${g.tip} € Trinkgeld.`;
      G.gi++; G.si=0;
      if(G.gi>=G.guests.length){G.phase="market";G.banner="Feierabend! Jetzt noch Zutaten auf dem Markt kaufen.";}
    }else G.banner="";
  }
  render(); $("#screen").scrollTop=0; autoSpeak();
}
function endDay(){
  const LV=LEVELS[S.level];
  const rev=G.revenue||0, ing=Math.round(rev*.35), rent=LV.rent, net=rev+G.earned-ing-rent+G.saved;
  const d=new Date(), today=d.toLocaleDateString("sv-SE"); d.setDate(d.getDate()-1); const yest=d.toLocaleDateString("sv-SE");
  if(S.last!==today)S.streak=S.last===yest?S.streak+1:1;
  S.last=today;
  G.summary={ing,rent,net,day:S.day};
  S.vocab.days[S.day]=buildVocab(S.day);
  G.seen=null;G.ex=null;G.wt=null;G.tapped=null;
  S.coins=Math.max(0,S.coins+net); S.day++; save();
  screen="summary"; render(); sfx("coins");
}

document.addEventListener("pointerdown",e=>{
  if(screen!=="setup"||(S.setupQuiz&&!S.setupDone))return;

  if(!pi&&!ri)return;

  const id=pi?pi.dataset.id:S.room[+ri.dataset.i].id, it=roomItem(id); if(!it)return;
  drag={id,from:pi?"pal":"room",idx:ri?+ri.dataset.i:-1,sx:e.clientX,sy:e.clientY,moved:false,el:pi||ri};
  const g=$("#ghost"); g.innerHTML=itemArt(it); g.style.width=Math.max(48,($("#room").offsetWidth*it.w/100))+"px"; ghostAt(e.clientX,e.clientY);
  e.preventDefault();
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6){drag.moved=true;$("#ghost").hidden=false;if(drag.from==="room")drag.el.style.opacity=".25";}
  if(drag.moved)ghostAt(e.clientX,e.clientY);
});
document.addEventListener("pointerup",e=>{
  if(!drag)return;
  const d=drag; drag=null; $("#ghost").hidden=true;
  if(!d.moved){showName(d.el,roomItem(d.id));return;}
  const r=$("#room").getBoundingClientRect();
  const inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
  if(inside){
    const x=Math.round((e.clientX-r.left)/r.width*1000)/10, y=Math.round((e.clientY-r.top)/r.height*1000)/10;
    if(d.from==="pal")S.room.push({id:d.id,x,y}); else{S.room[d.idx].x=x;S.room[d.idx].y=y;}

const PROPER=new Set("toledo umberto garibaldi tribunali roma milano napoli sorrento capri luca rossi corso".split(" "));
const STOP=new Set("a al all' alla alle c' che ci con d' da dal dalla dei del della di dov' e è i il in io l' la le lo ma mi ne nel nell' nelle per si sì un un' una sono no non lei me mio mia ecco po' qui là lì sul sulla poi molto tanto troppo ho fa sta sto era suo nostra nostre gliene questa qual quale ogni mai".split(" "));
function collectWords(text,de,weight){
  if(!G||!text)return;
  G.seen=G.seen||new Set(); G.ex=G.ex||{}; G.wt=G.wt||{};
  (text.match(/[A-Za-zÀ-ÖØ-öø-ÿ]+'?/g)||[]).forEach(w=>{
    const k=w.toLowerCase(), d=DICT[k];
    if(!d||STOP.has(k)||PROPER.has(k))return;
    if(/^\d+$/.test(d)&&+d>20)return;
    G.seen.add(k); if(!G.ex[k])G.ex[k]=[text,de||""]; G.wt[k]=(G.wt[k]||0)+(weight||1);
  });
}
function collectStep(st){
  if(st.kind==="pizza"){collectWords(st.it,st.de,1);[...st.want].forEach(k=>collectWords(k,ING[k][0],1));return;}
  collectWords(st.it,st.de,st.wrong||st.gaveUp?3:1);
  if(st.corDe){const c=st.opts.find(o=>o.ok);if(c)collectWords(c.t,st.corDe,st.wrong||st.gaveUp?3:1);}
}
function buildVocab(dayN){
  const before=new Set(); Object.entries(S.vocab.days).forEach(([d,l])=>{if(+d<dayN)l.forEach(v=>before.add(v.it));});
  const wt=(G&&G.wt)||{}, tapped=(G&&G.tapped)||new Set();
  let cand=[...((G&&G.seen)||[])].filter(k=>!before.has(k)).sort((a,b)=>((tapped.has(b)?10:0)+(wt[b]||0))-((tapped.has(a)?10:0)+(wt[a]||0)));
  let list=cand.slice(0,12).map(k=>({it:k,de:DICT[k],ex:(G.ex&&G.ex[k])||null}));
  if(dayN===1&&S.room)ROOM_ITEMS.slice(0,6).forEach(i=>list.push({it:i.it,de:i.de,ex:null}));
  if(list.length<5){ // zu wenig Neues: schwierige alte Wörter wiederholen
    Object.entries(S.book).sort((a,b)=>b[1].miss-a[1].miss).forEach(([it,v])=>{if(list.length<8&&it.split(" ").length<=2&&!list.some(x=>x.it===it))list.push({it,de:v.de,ex:null});});
  }
  return list;
}
const stripArt=s=>s.replace(/^(il|lo|la|i|gli|le|un|uno|una)\s+/,"").replace(/^(l'|un')/,"");
const norm=s=>stripArt(s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’`]/g,"'").replace(/[^a-z' ]/g," ").replace(/\s+/g," ").trim());
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function vocabUnlocked(d){return d===1||!!S.vocab.done[d-1];}
function vocabStatus(){
  const days=Object.keys(S.vocab.days).map(Number).sort((a,b)=>a-b);
  if(!days.length)return "Deine Vokabeln kommen nach dem ersten Spieltag";
  const open=days.find(d=>!S.vocab.done[d]);
  if(!open)return `Alle ${days.length} ${days.length===1?"Tag":"Tage"} gelernt ✓`;
  return vocabUnlocked(open)?`Tag ${open}: ${S.vocab.days[open].length} Wörter warten`:`Tag ${open} wartet`;
}
function startVocab(d){
  const list=S.vocab.days[d]; if(!list||!vocabUnlocked(d))return;
  S.vocabRun={day:d,queue:shuffle(list.map((_,k)=>({k,st:0}))),total:list.length,mastered:0,wrong:0,showTip:false,res:null,typed:"",opts:null,missed:false};
  prepVocabQ(); screen="vocab"; render();
}
function prepVocabQ(){
  const R=S.vocabRun, q=R.queue[0]; if(!q)return;
  R.wrong=0;R.showTip=false;R.res=null;R.typed="";R.missed=false;R.msg="";
  if(q.st===0){
    const list=S.vocab.days[R.day], v=list[q.k];
    let pool=list.filter((x,i)=>i!==q.k&&x.de!==v.de).map(x=>x.de);
    if(pool.length<3)pool=pool.concat(Object.values(DICT).filter(x=>!/^\d+$/.test(x)&&x!==v.de));
    R.opts=shuffle([v.de,...sample([...new Set(pool)],3)]);
  }else R.opts=null;
}
function vocabAnswer(ans){
  const R=S.vocabRun, q=R.queue[0], v=S.vocab.days[R.day][q.k];
  let ok=false;
  if(q.st===0){ok=ans===v.de;}
  else{
    const a=ans.trim(), want=v.it;
    if(!a)return;
    if(stripArt(a.toLowerCase())===stripArt(want.toLowerCase())){ok=true;R.msg="";}
    else if(norm(a)===norm(want)){ok=true;R.msg=`Richtig! Achte auf die Schreibweise: ${want}`;}
    else if(norm(want).length>=5&&lev(norm(a),norm(want))<=1){ok=true;R.msg=`Fast perfekt! Richtig geschrieben: ${want}`;}
    R.typed=a;
  }
  if(ok){sfx("right");R.res="ok";speak(v.it);}
  else{sfx("wrong");R.wrong++;R.missed=true;R.res="bad";R.badAns=ans;note(v.it,v.de);}
  render();
}
function vocabNext(){
  const R=S.vocabRun, q=R.queue.shift();
  if(R.missed){R.queue.push({k:q.k,st:q.st});}
  else if(q.st===0){const pos=Math.min(R.queue.length,2+Math.floor(Math.random()*Math.max(1,R.queue.length-1)));R.queue.splice(pos,0,{k:q.k,st:1});}
  else R.mastered++;
  if(!R.queue.length){S.vocab.done[R.day]=true;R.finished=true;sfx("coins");render();return;}
  prepVocabQ(); render(); const nq=R.queue[0]; if(nq.st===0)setTimeout(()=>speak(S.vocab.days[R.day][nq.k].it),200);
}

/* ---------- Events ---------- */
let popTimer=null, pressTimer=null, suppressClick=false;
function showWord(el){
  const w=el.dataset.w, de=lookup(w); if(!de)return;
  const pop=$("#pop"); pop.innerHTML=`${esc(w)} = ${esc(de)}<small>ins Notizbuch gelegt</small>`; pop.hidden=false;
  const r=el.getBoundingClientRect(), pw=pop.offsetWidth;
  pop.style.left=Math.max(8,Math.min(innerWidth-pw-8,r.left+r.width/2-pw/2))+"px";
  pop.style.top=Math.max(8,r.top-pop.offsetHeight-8)+"px";
  clearTimeout(popTimer); popTimer=setTimeout(()=>{pop.hidden=true;},2600);
  if(de!=="Name"){note(w.toLowerCase(),de); if(G){G.seen=G.seen||new Set();G.seen.add(w.toLowerCase());G.tapped=G.tapped||new Set();G.tapped.add(w.toLowerCase());}}
  if(G&&screen==="play"){const st=curStep();if(st&&!st.done)st.peeked=true;}
  sfx("select"); save();
}
document.addEventListener("pointerdown",e=>{
  const w=e.target.closest(".opt .w"); if(!w)return;
  clearTimeout(pressTimer); pressTimer=setTimeout(()=>{suppressClick=true;showWord(w);},420);
});
["pointerup","pointercancel","pointermove"].forEach(ev=>document.addEventListener(ev,e=>{if(ev!=="pointermove"||Math.abs(e.movementX)+Math.abs(e.movementY)>6)clearTimeout(pressTimer);}));
document.addEventListener("contextmenu",e=>{if(e.target.closest(".opt,.w"))e.preventDefault();});
function handleClick(e){
  if(suppressClick){suppressClick=false;return;}
  const t=e.target.closest("[data-act]"); if(!t||t.disabled||t.getAttribute("aria-disabled")==="true")return;
  if(t.dataset.act==="word")return showWord(t);
  const a=t.dataset.act;
  if(a!=="opt"&&a!=="serve")sfx(a==="ing"||a==="qty"?"select":"click");
  if(a==="vol"){volOpen=!volOpen;return render();}
  if(a==="update"&&UPDATE){flushSave();location.href=UPDATE.url;return;}
  if(a==="start"){if(!S.setupDone){screen="setup";return render();}if(G&&!G.summary){screen="play";render();autoSpeak();return;}G=null;return startDay();}
  if(a==="home"||a==="quit"){if(screen==="summary")G=null;screen="home";return render();}
  if(a==="shop"){screen="shop";return render();}
  if(a==="setup"){screen="setup";return render();}
  if(a==="setupCheck"){if(ROOM_ITEMS.every(i=>S.room.some(r=>r.id===i.id)))startSetupQuiz();return;}
  if(a==="ritem"){return quizAnswer(+t.dataset.i);}
  if(a==="qtip"){S.setupQuiz.showTip=true;return render();}
  if(a==="qidk"){const Q=S.setupQuiz,it=roomItem(S.room[Q.queue[Q.qi]].id);note(it.it,it.de);sfx("wrong");Q.flash=Q.queue[Q.qi];Q.flashOk=true;Q.queue.push(Q.queue[Q.qi]);Q.qi++;Q.wrong=0;Q.showTip=false;Q.revealed=false;render();showName(document.querySelector(`.ri[data-i="${Q.queue[Q.queue.length-1]}"]`),it);return;}
  if(a==="setupDone"){S.setupDone=true;S.setupQuiz=null;G=null;return startDay();}
  if(a==="vocab"){screen="vocab";if(S.vocabRun&&S.vocabRun.finished)S.vocabRun=null;return render();}
  if(a==="vlist"){if(S.vocabRun&&S.vocabRun.finished)S.vocabRun=null;else if(S.vocabRun)S.vocabRun.paused=true;screen="vocab";const R=S.vocabRun;S.vocabRun=null;S.vocabPaused=R&&!R.finished?R:S.vocabPaused;return render();}
  if(a==="vstart"){const d=+t.dataset.d;if(S.vocabPaused&&S.vocabPaused.day===d&&!S.vocab.done[d]){S.vocabRun=S.vocabPaused;S.vocabPaused=null;screen="vocab";return render();}S.vocabPaused=null;return startVocab(d);}
  if(a==="vsay"){const R=S.vocabRun;return speak(S.vocab.days[R.day][R.queue[0].k].it);}
  if(a==="vopt"){const R=S.vocabRun;if(R.res==="ok")return;return vocabAnswer(R.opts[+t.dataset.i]);}
  if(a==="vtip"){S.vocabRun.showTip=true;return render();}
  if(a==="vidk"){const R=S.vocabRun,v=S.vocab.days[R.day][R.queue[0].k];note(v.it,v.de);R.missed=true;R.res="ok";R.msg=`Das heißt: ${v.it} = ${v.de}. Kommt gleich nochmal.`;if(R.queue[0].st===1)R.typed=v.it;else R.badAns=null;speak(v.it);return render();}
  if(a==="vnext")return vocabNext();
  if(a==="vacc"){const i=$("#vin");if(i&&!i.readOnly){i.value+=t.dataset.c;i.focus();}return;}
  if(a==="book"){screen="book";return render();}
  if(a==="sound"){S.sound=!S.sound;save();return render();}
  if(a==="sayit")return speak(t.dataset.t);
  if(a==="buy"){const i=SHOP.find(x=>x.id===t.dataset.id);if(i&&S.coins>=i.cost){S.coins-=i.cost;S.owned.push(i.id);sfx("coins");if(i.up)S.level=i.up;save();}return render();}
  if(a==="menu"){menuOpen=!menuOpen;return render();}
  if(!G)return;
  const st=curStep();
  if(a==="speak")return speak(st.it);
  if(a==="text"){st.showText=true;st.textShown=true;return render();}
  if(a==="next")return advance();
  if(st.done)return;
  if(a==="opt"){const i=+t.dataset.i;if(st.opts[i].ok){sfx("right");finish();if(st.phone)st.showText=true;}else{sfx("wrong");wrongAnswer(i);}return render();}
  if(a==="ing"){const k=t.dataset.k;st.cur.has(k)?st.cur.delete(k):st.cur.add(k);return render();}
  if(a==="qty"){st.curQty=Math.min(4,Math.max(1,st.curQty+ +t.dataset.d));return render();}
  if(a==="serve"){
    const same=st.cur.size===st.want.size&&[...st.want].every(k=>st.cur.has(k))&&(S.level===0||st.curQty===st.qty);
    if(same){sfx("right");finish();} else{sfx("wrong");wrongAnswer();[...new Set([...st.want,...st.cur])].filter(k=>st.want.has(k)!==st.cur.has(k)).forEach(k=>note(k,ING[k][0]));save();}
    return render();
  }
  if(a==="tip"){st.showTip=true;return render();}
  if(a==="idk"){giveUp();if(st.phone)st.showText=true;return render();}
}
document.addEventListener("click",e=>{handleClick(e);save();});
document.addEventListener("submit",e=>{if(e.target.id==="vform"){e.preventDefault();const R=S.vocabRun;if(R&&R.res!=="ok"){vocabAnswer($("#vin").value);save();}}});
document.addEventListener("keydown",e=>{const t=e.target.closest&&e.target.closest('[role="button"][data-act]');if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();t.click();}});
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay"){menuOpen=false;volOpen=false;render();}});
$("#overlay").addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="v-auto"){S.sound=e.target.checked;save();return;}
  const key={"v-music":"music","v-sfx":"sfx","v-voice":"voice"}[id]; if(!key)return;
  S.vol[key]=+e.target.value/100; $("#"+id+"-o").textContent=e.target.value+" %";
  initAudio(); if(key==="music"&&S.vol.music>0)startMusic(); applyVolume(); save();
});
$("#overlay").addEventListener("change",e=>{
  if(e.target.id==="v-sfx")sfx("right");
  if(e.target.id==="v-voice")speak("Ciao! Benvenuto in pizzeria.");
});

/* ---------- Start: Spielstand laden, Cloud abgleichen, nach Updates suchen ---------- */
let UPDATE=null;
const APP_BUILD="__APP_BUILD__", APP_REPO="__APP_REPO__"; // werden beim App-Bau automatisch ersetzt
const isNativeApp=(()=>{try{return !!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());}catch(e){return false;}})();
(function boot(){
  let raw=null; try{raw=localStorage.getItem(KEY);}catch(e){}
  if(raw)applySave(raw);
  render();
  (async()=>{try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const uid=user?await user.id():null; if(!db||!uid)return;
    dbRef=db.doc("data/users/"+uid+"/spielstand");
    const snap=await dbRef.get(), d=snap.exists?snap.data():null;
    if(d&&typeof d.state==="string"&&(d.savedAt||0)>savedAt){
      const raw2=JSON.stringify({savedAt:d.savedAt,state:d.state});
      if(applySave(raw2)){try{localStorage.setItem(KEY,raw2);}catch(e){}}
      cloudState="cloud"; render(); return;
    }
    if(savedAt)await cloudSave(); else cloudState="cloud";
    if(screen==="home")render();
  }catch(e){}})();
  (async()=>{
    if(!isNativeApp||APP_REPO.indexOf("__")===0)return;
    try{
      const r=await fetch("https://api.github.com/repos/"+APP_REPO+"/releases/latest",{cache:"no-store"}); if(!r.ok)return;
      const j=await r.json(), n=parseInt(String(j.tag_name||"").split(".").pop(),10), cur=parseInt(APP_BUILD,10);
      if(n>cur){const apk=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));UPDATE={tag:j.tag_name,url:apk?apk.browser_download_url:j.html_url};if(screen==="home")render();}
    }catch(e){}
  })();
})();
</script>
