name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Pakete installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Nur Hochformat
        run: sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml

      - name: Versionsnummer setzen (damit Updates über die alte App drüber installieren)
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          sed -i "s|__APP_BUILD__|${{ github.run_number }}|; s|__APP_REPO__|${{ github.repository }}|" www/index.html

      - name: Immer denselben Signatur-Schlüssel nutzen (sonst geht kein Update)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: App-Icon und Startbild
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1b221f' --splashBackgroundColor '#1b221f' || echo "Icons übersprungen"

      - name: Spiel in die App kopieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PizzeriaParola.apk

      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Pizzeria Parola v1.${{ github.run_number }}
          body: Tippe unten auf PizzeriaParola.apk, um die App auf dein Android-Handy zu laden.
          files: PizzeriaParola.apk
