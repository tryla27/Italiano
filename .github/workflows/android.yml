name: Android-App bauen

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android-Werkzeuge prüfen
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Pakete installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Nur Hochformat
        run: sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml

      - name: Versionsnummer setzen (damit Updates über die alte App drüber installieren)
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          sed -i "s|__APP_BUILD__|${{ github.run_number }}|; s|__APP_REPO__|${{ github.repository }}|" www/js/start.js
          grep -q "__APP_BUILD__" www/js/start.js && { echo "Versionsnummer nicht eingesetzt"; exit 1; } || true

      - name: Immer denselben Signatur-Schlüssel nutzen (sonst geht kein Update)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  fixed {
                      storeFile file("${rootDir}/../signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixed }
              }
          }
          GRADLE
          tail -20 android/app/build.gradle

      - name: App-Icon und Startbild
        run: npx capacitor-assets generate --android --iconBackgroundColor '#d99a4e' --splashBackgroundColor '#1b221f' || echo "Icons übersprungen"

      - name: Spiel in die App kopieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ParlaPizza.apk

      - name: Prüfen, dass der richtige Schlüssel benutzt wurde
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs ParlaPizza.apk | tee certs.txt
          grep -qi "SHA-256 digest: 7fae6aeda93d2829c87a34ba10d462581f011635476c42d9355317c3c36c3635" certs.txt || { echo "FALSCHER SCHLÜSSEL – Abbruch, sonst gehen Updates kaputt"; exit 1; }

      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Parla Pizza! v1.${{ github.run_number }}
          body: Tippe unten auf ParlaPizza.apk, um die App auf dein Android-Handy zu laden.
          files: ParlaPizza.apk
